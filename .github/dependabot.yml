version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tailwind_theme/static_src
    schedule:
      interval: weekly
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directories:
      - /
      - /deploy
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
